name: C++ CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and run tests
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat

      - name: Build and run tests
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./ci.sh